# Front door for the BaturPay sandbox stack.
# API is reachable under /api, everything else goes to the web dashboard.
upstream baturpay_api {
  server api:4000;
}

upstream baturpay_web {
  server web:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 1m;

  # Security headers (baseline; tighten for real deployments).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    proxy_pass http://baturpay_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /health {
    proxy_pass http://baturpay_api/health;
  }

  location / {
    proxy_pass http://baturpay_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
