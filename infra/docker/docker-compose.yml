# ==========================================================================
# BaturPay — local & deployable stack (sandbox)
# Powered by Ibra X 3.1 Sovereign Execution Engine
# Author: Ibra Ramdan <ibradecode@gmail.com>
#
# Brings up Postgres, the API, the web dashboard, and an Nginx front door.
# Live money operations stay disabled: the API fails closed by default.
# ==========================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baturpay
      POSTGRES_PASSWORD: baturpay
      POSTGRES_DB: baturpay
    ports:
      - '5432:5432'
    volumes:
      - baturpay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baturpay -d baturpay']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BATURPAY_MODE: sandbox
      NODE_ENV: production
      PORT: '4000'
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: http://localhost:4000
      DATABASE_URL: postgres://baturpay:baturpay@postgres:5432/baturpay
      PGSSLMODE: disable
      API_KEY_PEPPER: ${API_KEY_PEPPER:-development-pepper-change-me}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-development-webhook-secret}
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:-development-session-secret}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: 'true'
      WEBHOOK_EGRESS_ALLOWLIST: localhost,127.0.0.1,host.docker.internal
      LIVE_PAYMENTS_ENABLED: 'false'
      GO_LIVE_ATTESTATION: ''
    ports:
      - '4000:4000'

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_BATURPAY_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ../nginx/baturpay.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:80'

volumes:
  baturpay_pg:
